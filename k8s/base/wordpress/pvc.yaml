---
# Armazena os uploads de mídia do WordPress (wp-content/uploads/).
# RWO é suficiente para 1 réplica. Para escalar horizontalmente,
# trocar por ceph-filesystem (RWX) ou usar um plugin de offload para S3.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wordpress-uploads
  namespace: openknowledge
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ceph-block-hdd
  resources:
    requests:
      storage: 20Gi
