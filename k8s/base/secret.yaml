---
# TEMPLATE — não versionar com valores reais.
#
# ── Produção ────────────────────────────────────────────────────────────────
# kubectl create secret generic wordpress-secret -n openknowledge \
#   --from-literal=WORDPRESS_DB_USER='wp_user' \
#   --from-literal=WORDPRESS_DB_PASSWORD='<SENHA_DB>' \
#   --from-literal=MARIADB_ROOT_PASSWORD='<SENHA_ROOT>' \
#   --from-literal=WORDPRESS_CONFIG_EXTRA="$(cat <<'EOF'
# define('WP_HOME',    'https://ok.org.br');
# define('WP_SITEURL', 'https://ok.org.br');
# define('AUTH_KEY',         '<gerar em https://api.wordpress.org/secret-key/1.1/salt/>');
# define('SECURE_AUTH_KEY',  '<VALOR>');
# define('LOGGED_IN_KEY',    '<VALOR>');
# define('NONCE_KEY',        '<VALOR>');
# define('AUTH_SALT',        '<VALOR>');
# define('SECURE_AUTH_SALT', '<VALOR>');
# define('LOGGED_IN_SALT',   '<VALOR>');
# define('NONCE_SALT',       '<VALOR>');
# define('WP_MEMORY_LIMIT', '256M');
# define('FORCE_SSL_ADMIN', true);
# EOF
# )"
#
# ── Staging (mesmo namespace, prefixo staging-) ────────────────────────────
# kubectl create secret generic staging-wordpress-secret -n openknowledge \
#   --from-literal=WORDPRESS_DB_USER='wp_user' \
#   --from-literal=WORDPRESS_DB_PASSWORD='<SENHA_DB_STAGING>' \
#   --from-literal=MARIADB_ROOT_PASSWORD='<SENHA_ROOT_STAGING>' \
#   --from-literal=WORDPRESS_CONFIG_EXTRA="$(cat <<'EOF'
# define('WP_HOME',    'https://<STAGING_DOMAIN>');
# define('WP_SITEURL', 'https://<STAGING_DOMAIN>');
# ... (chaves staging independentes das de produção)
# EOF
# )"
apiVersion: v1
kind: Secret
metadata:
  name: wordpress-secret
  namespace: openknowledge
type: Opaque
stringData:
  WORDPRESS_DB_USER: "<PLACEHOLDER>"
  WORDPRESS_DB_PASSWORD: "<PLACEHOLDER>"
  MARIADB_ROOT_PASSWORD: "<PLACEHOLDER>"
  WORDPRESS_CONFIG_EXTRA: "<PLACEHOLDER>"
