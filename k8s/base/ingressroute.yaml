---
# IngressRoute base (HTTP, domínio placeholder).
# O overlay de produção substitui /spec inteiro com HTTPS + TLS cert-manager.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: wordpress
  namespace: openknowledge
spec:
  entryPoints:
    - web
  routes:
    - match: "Host(`<DOMAIN_PLACEHOLDER>`)"
      kind: Rule
      services:
        - name: wordpress
          port: 80
