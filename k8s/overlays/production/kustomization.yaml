---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: openknowledge

# Prefixo em todos os recursos para alinhar com a infraestrutura de produção
namePrefix: prod-

labels:
  - pairs:
      environment: production
    includeSelectors: true

resources:
  - ../../base
  - certificate.yaml

images:
  - name: ghcr.io/okfn-brasil/site-okbr
    newTag: "latest"  # atualizado automaticamente pelo workflow de CI

patches:
  # ── StatefulSet: serviceName precisa do prefixo ───────────────────────────
  - patch: |-
      - op: replace
        path: /spec/serviceName
        value: prod-mariadb
    target:
      kind: StatefulSet
      name: mariadb

  # ── ConfigMap: DB_HOST aponta para o serviço prod dentro do mesmo ns ──────
  - patch: |-
      - op: replace
        path: /data/WORDPRESS_DB_HOST
        value: "prod-mariadb:3306"
    target:
      kind: ConfigMap
      name: wordpress-config

  # ── IngressRoute HTTPS ────────────────────────────────────────────────────
  - patch: |-
      - op: replace
        path: /spec
        value:
          entryPoints:
            - websecure
          routes:
            - match: "Host(`<DOMAIN_PLACEHOLDER>`) || Host(`www.<DOMAIN_PLACEHOLDER>`)"
              kind: Rule
              middlewares:
                - name: security-headers
                  namespace: querido-diario
                - name: compression
                  namespace: querido-diario
              services:
                - name: prod-wordpress
                  port: 80
          tls:
            secretName: site-okbr-tls
    target:
      kind: IngressRoute
      name: wordpress

  # ── Namespace: não aplicar (já existe no cluster) ─────────────────────────
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata:
        name: openknowledge
    target:
      kind: Namespace
      name: openknowledge

