---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - certificate.yaml

images:
  - name: ghcr.io/okfn-brasil/site-okbr
    newTag: "latest"  # atualizado automaticamente pelo workflow de CI

patches:
  # ── IngressRoute HTTPS ──────────────────────────────────────────────────────
  - patch: |-
      - op: replace
        path: /spec
        value:
          entryPoints:
            - websecure
          routes:
            - match: "Host(`<DOMAIN_PLACEHOLDER>`)"
              kind: Rule
              middlewares:
                - name: security-headers
                  namespace: querido-diario
                - name: compression
                  namespace: querido-diario
              services:
                - name: wordpress
                  port: 80
          tls:
            secretName: site-okbr-tls
    target:
      kind: IngressRoute
      name: wordpress

  # ── Namespace: não aplicar (já existe no cluster) ──────────────────────────
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata:
        name: openknowledge
    target:
      kind: Namespace
      name: openknowledge

  # ── Secret: não aplicar (gerenciado manualmente via kubectl) ───────────────
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: wordpress-secret
    target:
      kind: Secret
      name: wordpress-secret
