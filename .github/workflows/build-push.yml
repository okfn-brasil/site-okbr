name: Build and Push Docker Image

on:
  push:
    branches: [main]

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          cache-from: type=registry,ref=ghcr.io/okfn-brasil/site-okbr:latest
          cache-to: type=inline
          tags: |
            ghcr.io/okfn-brasil/site-okbr:latest
            ghcr.io/okfn-brasil/site-okbr:${{ github.sha }}

      - name: Update image tag in production overlay
        run: |
          TAG=${{ github.sha }}
          sed -i "s|newTag: \".*\"|newTag: \"${TAG}\"|" \
            k8s/overlays/production/kustomization.yaml

      - name: Commit updated kustomization
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "ci: atualiza tag da imagem para ${{ github.sha }} [skip ci]"
          file_pattern: k8s/overlays/production/kustomization.yaml
