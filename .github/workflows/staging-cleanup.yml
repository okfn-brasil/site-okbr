name: Teardown Staging

on:
  pull_request:
    types: [closed]

jobs:
  teardown:
    runs-on: ubuntu-latest
    environment: staging
    # Secrets/vars necessários (ambiente "staging"):
    #   secrets.KUBECONFIG_REVOADA → kubeconfig base64
    #   secrets.WIREGUARD_CONFIG   → conteúdo do arquivo wg0.conf (VPN Revoada)

    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Instala WireGuard
        run: sudo apt-get install -y wireguard wireguard-tools

      - name: Conecta à VPN Revoada
        run: |
          echo "${{ secrets.WIREGUARD_CONFIG }}" | sudo tee /etc/wireguard/wg0.conf > /dev/null
          sudo chmod 600 /etc/wireguard/wg0.conf
          sudo wg-quick up wg0
          sleep 2

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_REVOADA }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Teardown staging (preserva PVCs)
        run: |
          # Remove todos os recursos de staging EXCETO os PVCs.
          # Os PVCs (banco + uploads) são preservados para que o próximo deploy
          # de staging encontre o banco já populado, sem necessidade de re-seed.
          kubectl delete \
            deployments,statefulsets,services,configmaps,secrets,\
            ingressroutes.traefik.io,certificates.cert-manager.io \
            -n openknowledge \
            -l environment=staging \
            --ignore-not-found=true

      - name: Desconecta VPN
        if: always()
        run: sudo wg-quick down wg0

      - name: Post cleanup comment
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🧹 Ambiente de homologação removido (PVCs preservados para o próximo deploy).`
            });
